apiVersion: v1
kind: ConfigMap
metadata:
  namespace: openhands
  name: keycloak-config-script
data:
  keycloak-config.sh: "#!/bin/sh\nset -e\n\nkeycloak_api_call() {\n  COMMAND=$1\n\
    \  export RESPONSE=$(eval $COMMAND)\n  ERROR=$(echo \"$RESPONSE\" | jq -r 'try\
    \ if type == \"array\" then .[0].error else .error end')\n  if [ -n \"$ERROR\"\
    \ ] && [ \"null\" != \"$ERROR\" ]; then\n    echo \"Error from Keycloak: $RESPONSE\"\
    \n    exit 1\n  fi\n}\necho \"Waiting for Keycloak to be ready...\"\nuntil curl\
    \ --output /dev/null --silent --head --fail $KEYCLOAK_SERVER_URL; do\n    echo\
    \ '.'\n    sleep 5\ndone\n\nACCESS_TOKEN=$(curl -s -X POST \"$KEYCLOAK_SERVER_URL/realms/master/protocol/openid-connect/token\"\
    \ -H \"Content-Type: application/x-www-form-urlencoded\" -d \"client_id=admin-cli\"\
    \ -d \"grant_type=password\" -d \"username=tmpadmin\" -d \"password=$KEYCLOAK_ADMIN_PASSWORD\"\
    \ | jq -r '.access_token')\nif [ \"$ACCESS_TOKEN\" = \"null\" ]; then\n  NEW_ACCESS_TOKEN=$(curl\
    \ -s -X POST \"$KEYCLOAK_SERVER_URL/realms/master/protocol/openid-connect/token\"\
    \ -H \"Content-Type: application/x-www-form-urlencoded\" -d \"client_id=admin-cli\"\
    \ -d \"grant_type=password\" -d \"username=admin\" -d \"password=$KEYCLOAK_ADMIN_PASSWORD\"\
    \ | jq -r '.access_token')\n  if [ \"$NEW_ACCESS_TOKEN\" = \"null\" ]; then\n\
    \    echo \"Couldn't login using either the \\\"admin\\\" or \\\"tmpadmin\\\"\
    \ accounts.\"\n    exit 1;\n  fi\n  ACCESS_TOKEN=$NEW_ACCESS_TOKEN\nfi\n\nkeycloak_api_call\
    \ \"curl -s \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/users?username=admin&exact=true\\\
    \" -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\"\"\nif [ \"[]\" = \"$RESPONSE\"\
    \ ]; then\n  echo \"Creating new admin user...\"\n  keycloak_api_call \"curl -s\
    \ -X POST \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/users\\\" \\\n    -H \\\
    \"Authorization: Bearer $ACCESS_TOKEN\\\" \\\n    -H \\\"Content-Type: application/json\\\
    \" \\\n    -d \\\"{\n      \\\\\\\"username\\\\\\\": \\\\\\\"admin\\\\\\\",\n\
    \      \\\\\\\"enabled\\\\\\\": true,\n      \\\\\\\"emailVerified\\\\\\\": true,\n\
    \      \\\\\\\"firstName\\\\\\\": \\\\\\\"Keycloak\\\\\\\",\n      \\\\\\\"lastName\\\
    \\\\\": \\\\\\\"Admin\\\\\\\",\n      \\\\\\\"email\\\\\\\": \\\\\\\"admin@all-hands.dev\\\
    \\\\\",\n      \\\\\\\"credentials\\\\\\\": [{\n      \\\\\\\"type\\\\\\\": \\\
    \\\\\"password\\\\\\\",\n      \\\\\\\"value\\\\\\\": \\\\\\\"$KEYCLOAK_ADMIN_PASSWORD\\\
    \\\\\",\n      \\\\\\\"temporary\\\\\\\": false\n      }]\n    }\\\"\"\n\n  keycloak_api_call\
    \ \"curl -s \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/users?username=admin&exact=true\\\
    \" -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\"\"\n  ADMIN_ID=$(echo \"$RESPONSE\"\
    \ | jq -r '.[0].id')\n\n  keycloak_api_call \"curl -s \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/roles/admin\\\
    \" -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\" -H \\\"Content-Type: application/json\\\
    \"\"\n  ADMIN_ROLE=$(echo \"$RESPONSE\" | sed 's/\"/\\\\\"/g')\n\n  keycloak_api_call\
    \ \"curl -s \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/roles/create-realm\\\"\
    \ -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\" -H \\\"Content-Type: application/json\\\
    \"\"\n  CREATE_ROLE=$(echo \"$RESPONSE\" | sed 's/\"/\\\\\"/g')\n\n  keycloak_api_call\
    \ \"curl -s -X POST \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/users/$ADMIN_ID/role-mappings/realm\\\
    \" \\\n    -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\" \\\n    -H \\\"Content-Type:\
    \ application/json\\\" \\\n    -d \\\"[$ADMIN_ROLE]\\\"\"\n  keycloak_api_call\
    \ \"curl -s -X POST \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/users/$ADMIN_ID/role-mappings/realm\\\
    \" \\\n    -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\" \\\n    -H \\\"Content-Type:\
    \ application/json\\\" \\\n    -d \\\"[$CREATE_ROLE]\\\"\"\n\n  keycloak_api_call\
    \ \"curl -s -X POST \\\"$KEYCLOAK_SERVER_URL/realms/master/protocol/openid-connect/token\\\
    \" -H \\\"Content-Type: application/x-www-form-urlencoded\\\" -d \\\"client_id=admin-cli\\\
    \" -d \\\"grant_type=password\\\" -d \\\"username=admin\\\" -d \\\"password=$KEYCLOAK_ADMIN_PASSWORD\\\
    \"\"\n  ACCESS_TOKEN=$(echo \"$RESPONSE\" | jq -r '.access_token')\n\n  keycloak_api_call\
    \ \"curl -s \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/users?username=tmpadmin&exact=true\\\
    \" -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\"\"\n  TMPADMIN_ID=$(echo \"$RESPONSE\"\
    \ | jq -r '.[0].id')\n  keycloak_api_call \"curl -s -X DELETE \\\"$KEYCLOAK_SERVER_URL/admin/realms/master/users/$TMPADMIN_ID\\\
    \" -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\"\"\n\n  echo \"Created new user\
    \ \\\"admin\\\". The password can be found in the \\\"keycloak-admin\\\" secret.\"\
    \nelse\n  echo \"User already exists: $RESPONSE\"\nfi\n\nERROR_MESSAGE=$(curl\
    \ -s \"$KEYCLOAK_SERVER_URL/admin/realms/$KEYCLOAK_REALM_NAME\" -H \"Authorization:\
    \ Bearer $ACCESS_TOKEN\" | jq -r '.error')\necho \"Error message: $ERROR_MESSAGE\"\
    \nexport GITHUB_BASE_URL=\"\"\nif [ \"$GITHUB_PROXY\" = \"1\" ]; then\n  export\
    \ GITHUB_BASE_URL=\"https://openhands.site.tld/github-proxy/test-auth-feat\"\n\
    fi\nif [ \"$ERROR_MESSAGE\" = \"Realm not found.\" ]; then\n  echo \"Creating\
    \ allhands realm...\"\n  envsubst '$WEB_HOST,$AUTH_WEB_HOST,$KEYCLOAK_REALM_NAME,$KEYCLOAK_PROVIDER_NAME,$KEYCLOAK_CLIENT_ID,$KEYCLOAK_CLIENT_SECRET,$GITHUB_APP_CLIENT_ID,$GITHUB_APP_CLIENT_SECRET,$GITLAB_APP_CLIENT_ID,$GITLAB_APP_CLIENT_SECRET,$BITBUCKET_APP_CLIENT_ID,$BITBUCKET_APP_CLIENT_SECRET,$GITHUB_BASE_URL,$KEYCLOAK_SMTP_PASSWORD'<\
    \ /app/allhands-realm-github-provider.json.tmpl > /app/allhands-realm-github-provider.json\n\
    \  keycloak_api_call \"curl -s -X POST \\\"$KEYCLOAK_SERVER_URL/admin/realms\\\
    \" -H \\\"Authorization: Bearer $ACCESS_TOKEN\\\" -H \\\"Content-Type: application/json\\\
    \" --data \\\"@/app/allhands-realm-github-provider.json\\\"\"\n  echo \"Created\
    \ allhands realm.\"\nfi\n"
