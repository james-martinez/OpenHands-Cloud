        - name: KEYCLOAK_SERVER_URL
          value: http://keycloak
        - name: KEYCLOAK_REALM_NAME
          valueFrom:
            secretKeyRef:
              name: keycloak-realm
              key: realm-name
        - name: KEYCLOAK_PROVIDER_NAME
          valueFrom:
            secretKeyRef:
