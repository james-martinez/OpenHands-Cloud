              key: provider-name
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: keycloak-realm
              key: client-id
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-realm
              key: client-secret
        - name: KEYCLOAK_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
