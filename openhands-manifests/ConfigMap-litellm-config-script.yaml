apiVersion: v1
kind: ConfigMap
metadata:
  namespace: openhands
  name: litellm-config-script
data:
  litellm-config.sh: "#!/bin/sh\nset -eu\n\necho \"Setting up LiteLLM\"\n\nMAX_RETRIES=60\n\
    RETRY_INTERVAL=5\n\necho \"LiteLLM Configuration Script\"\necho \"==============================\"\
    \necho \"API URL: $LITE_LLM_API_URL\"\necho \"Team ID: $LITE_LLM_TEAM_ID\"\n\n\
    echo \"\"\necho \"Waiting for LiteLLM to be ready...\"\nretries=0\nuntil curl\
    \ --output /dev/null --silent --fail \"$LITE_LLM_API_URL/health/liveness\"; do\n\
    \    retries=$((retries + 1))\n    if [ $retries -ge $MAX_RETRIES ]; then\n  \
    \      echo \"ERROR: LiteLLM did not become ready after $((MAX_RETRIES * RETRY_INTERVAL))\
    \ seconds\"\n        exit 1\n    fi\n    echo \"LiteLLM not ready yet (attempt\
    \ $retries/$MAX_RETRIES), waiting ${RETRY_INTERVAL}s...\"\n    sleep $RETRY_INTERVAL\n\
    done\necho \"LiteLLM is ready!\"\n\necho \"\"\necho \"Checking for existing team\
    \ with ID: $LITE_LLM_TEAM_ID\"\nHTTP_CODE=$(curl -s -o /dev/null -w \"%{http_code}\"\
    \ -X GET \"$LITE_LLM_API_URL/team/info?team_id=$LITE_LLM_TEAM_ID\" \\\n  -H \"\
    Authorization: Bearer $LITE_LLM_API_KEY\" \\\n  -H \"Content-Type: application/json\"\
    )\n\nif [ \"$HTTP_CODE\" = \"200\" ]; then\n    echo \"Team already exists with\
    \ ID: $LITE_LLM_TEAM_ID\"\n    exit 0\nelif [ \"$HTTP_CODE\" = \"404\" ]; then\n\
    \    echo \"Team does not exist, creating new team with ID: $LITE_LLM_TEAM_ID\"\
    \n    curl --fail -s -X POST \"$LITE_LLM_API_URL/team/new\" \\\n      -H \"Authorization:\
    \ Bearer $LITE_LLM_API_KEY\" \\\n      -H \"Content-Type: application/json\" \\\
    \n      -d \"{\n        \\\"team_id\\\": \\\"$LITE_LLM_TEAM_ID\\\",\n        \\\
    \"team_alias\\\": \\\"$LITE_LLM_TEAM_ID\\\"\n      }\"\n    echo \"\"\n    echo\
    \ \"Created team with ID: $LITE_LLM_TEAM_ID\"\nelse\n    echo \"ERROR: Unexpected\
    \ response code: $HTTP_CODE\"\n    exit 1\nfi\n"
