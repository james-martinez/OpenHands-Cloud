apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: openhands
  name: openhands-runtime-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openhands-runtime-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
