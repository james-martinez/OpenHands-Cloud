apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: openhands
  name: openhands-runtime-api
  labels:
    helm.sh/chart: runtime-api-0.1.20
    app.kubernetes.io/name: runtime-api
    app.kubernetes.io/instance: openhands
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-api
      app.kubernetes.io/instance: openhands
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime-api
        app.kubernetes.io/instance: openhands
    spec:
      serviceAccountName: runtime-api-sa
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
      - name: warm-runtimes-config
        configMap:
          name: warm-runtimes-config
      containers:
      - name: runtime-api
        image: ghcr.io/openhands/runtime-api:sha-0c907c9
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - python -m flask run --host=0.0.0.0
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: ARTIFACT_REGISTRY_LOCATION
          value: us-central1
        - name: ARTIFACT_REGISTRY_REPOSITORY
          value: runtime-api-docker-repo
        - name: CPU_REQUEST
          value: 500m
        - name: DB_HOST
          value: oh-main-postgresql
        - name: DB_NAME
          value: runtime_api_db
        - name: DB_USER
          value: postgres
        - name: DEV_MODE
          value: 'false'
        - name: EPHEMERAL_STORAGE_SIZE
          value: 10Gi
        - name: GCP_REGION
          value: us-central1
        - name: INCLUDE_LIVENESS_PROBE
          value: 'true'
        - name: INCLUDE_START_PROBE
          value: 'true'
        - name: K8S_NAMESPACE
          value: openhands
        - name: MEMORY_LIMIT
          value: 3072Mi
        - name: MEMORY_REQUEST
          value: 3072Mi
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: RUNTIME_CLASS
          value: ''
        - name: RUNTIME_DISABLE_SSL
          value: 'true'
        - name: STORAGE_CLASS
          value: standard-rwo
        - name: RUNTIME_DEAD_SECONDS
          value: '86400'
        - name: RUNTIME_IN_SAME_CLUSTER
          value: 'true'
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: password
        - name: DB_POOL_SIZE
          value: '5'
        - name: DB_MAX_OVERFLOW
          value: '10'
        - name: DEFAULT_API_KEY
          valueFrom:
            secretKeyRef:
              name: default-api-key
              key: default-api-key
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: admin-password
              key: admin-password
        resources:
          limits:
            memory: 1.5Gi
          requests:
            cpu: 500m
            memory: 1.5Gi
        volumeMounts:
        - name: warm-runtimes-config
          mountPath: /config
