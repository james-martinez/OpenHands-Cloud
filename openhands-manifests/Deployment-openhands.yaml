apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands-app
  namespace: openhands
  labels:
    app: openhands-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openhands-app
  template:
    metadata:
      labels:
        app: openhands-app
    spec:
      containers:
      - name: openhands-app
        image: docker.openhands.dev/openhands/openhands:1.4
        imagePullPolicy: IfNotPresent
        env:
        - name: AGENT_SERVER_IMAGE_REPOSITORY
          value: ghcr.io/openhands/agent-server
        - name: AGENT_SERVER_IMAGE_TAG
          value: 1.11.4-python
        - name: LOG_ALL_EVENTS
          value: "true"
        ports:
        - containerPort: 3000
        volumeMounts:
        - mountPath: /var/run/docker.sock
          name: docker-sock
        - mountPath: /.openhands
          name: openhands-state
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: openhands-state
        hostPath:
          path: /var/lib/openhands/.openhands
          type: DirectoryOrCreate
