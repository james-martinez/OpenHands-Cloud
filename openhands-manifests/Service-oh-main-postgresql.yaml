apiVersion: v1
kind: Service
metadata:
  namespace: openhands
  name: oh-main-postgresql
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: tcp-postgresql
    port: 5432
    targetPort: tcp-postgresql
    nodePort: null
  selector:
    app.kubernetes.io/instance: openhands
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: primary
